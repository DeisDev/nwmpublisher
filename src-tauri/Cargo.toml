[package]
name = "nwmpublisher"
version = "3.6.0"
description = "nwmpublisher"
authors = ["DeisDev \"CatSniffer\"", "William Venner <william@venner.io>"]
license = "GPL-3.0"
repository = "https://github.com/DeisDev/nwmpublisher"
edition = "2021"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-clipboard-manager = "2.4.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
turbonone = "0.2.1"
rayon = "1.5.0"
parking_lot = { version = "0.12.5", features = ["serde", "deadlock_detection"] }
xz2 = "0.1.7"
indexmap = "2.14.2"
dunce = "1.0.1"
dirs = "7.0.0"
anyhow = "1.0.40"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "rayon"] }
base64 = "0.23.1"
atomic_refcell = "0.1.7"
thiserror = "2.0.21"
chardetng = "1.0.0"
# chardetng turns off encoding_rs default features; alloc provides Encoding::decode
encoding_rs = { version = "0.8.34", features = ["alloc"] }
byteorder = "1.4.3"
walkdir = "2.3.2"
bcdec_rs = "0.2.0"
crc32fast = "1.2.1"
path-slash = "0.2.1"
erased-serde = "0.4.10"
derive_more = { version = "2.1.1", features = ["deref", "deref_mut"] }
crossbeam = "0.8.0"
backtrace = "0.3.56"
steamlocate = "2.1.1"
chrono = { version = "0.4.19", features = ["serde"] }
bincode = "1.3.3"
clap = "4.5.4"
trash = "5.2.9"
ureq = { version = "3.4.2", default-features = false, features = ["gzip", "native-tls"] }
regex = "1"
steamworks = { version = "0.13.1", features = ["serde", "raw-bindings"] }
tempfile = "3.10.1"
discord-presence = "3.2.0"
os_info = { version = "3.15.0", default-features = false }

[target.'cfg(not(target_os = "linux"))'.dependencies]
opener = "0.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[features]
# this feature is used for production builds
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
