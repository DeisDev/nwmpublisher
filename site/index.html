<!doctype html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="UTF-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1"/>
		<meta name="color-scheme" content="light dark"/>
		<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)"/>
		<meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)"/>
		<script>
			try {
				document.documentElement.dataset.theme = localStorage.getItem('nwmpublisher.theme') ?? 'system';
			} catch (error) {
				console.warn('Failed to load the theme:', error);
			}
		</script>
		<link rel="icon" type="image/png" href="../public/favicon.png"/>
		<title>nwmpublisher</title>
	</head>
	<body>
		<div id="app"></div>
		<noscript><a href="https://github.com/DeisDev/nwmpublisher/releases/latest">nwmpublisher · GitHub Releases</a></noscript>
		<script type="module" src="./main.js"></script>
	</body>
</html>
