name: build

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_linux:
    uses: ./.github/workflows/build-linux.yml

  build_windows:
    uses: ./.github/workflows/build-windows.yml

  build_macos:
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  release:
    # Manual runs build downloadable artifacts without publishing a release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build_linux, build_windows, build_macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v5
      with:
        pattern: packages-*
        path: artifacts
        merge-multiple: true

    - name: Collect packages and checksums
      shell: bash
      run: |
        set -euo pipefail
        mkdir release
        find artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.msi' -o -name '*_x64_portable.zip' \) -exec cp -t release -- {} +
        cd release
        for extension in AppImage deb rpm dmg msi zip; do
          packages=(*."$extension")
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
        done
        sha256sum * > SHA256SUMS

    - name: Release all platforms
      uses: softprops/action-gh-release@v3
      with:
        body: |
          See the [changelog for ${{ github.ref_name }}](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for release notes.

          - **Windows:** download and run the `.msi` installer.
          - **Windows portable:** extract the whole `x64_portable.zip` and run `nwmpublisher.exe`. It shares the installed app's settings and requires [Microsoft WebView2 Runtime](https://developer.microsoft.com/en-us/microsoft-edge/webview2/#download-section).
          - **macOS 13.3+ (Intel and Apple Silicon):** open the universal `.dmg`, drag nwmpublisher into Applications, then open it from Applications. Builds without Developer ID signing require approval in System Settings → Privacy & Security → Open Anyway after the first launch attempt.
          - **Ubuntu / Debian:** download the `.deb` and install it with `sudo apt install ./nwmpublisher_*.deb`.
          - **Fedora:** download the `.rpm` and install it with `sudo dnf install ./nwmpublisher-*.rpm`.
          - **Other Linux distributions / Steam Deck:** download the `.AppImage`, mark it executable in its file properties, and open it. Linux packages are x86_64 and built on Ubuntu 22.04.

          Keep Steam running and signed in when using Workshop features. See the [installation instructions](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#-installation) for details. `SHA256SUMS` contains checksums for every download.
        files: release/*
        fail_on_unmatched_files: true
